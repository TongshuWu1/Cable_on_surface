# Cable particle filter live-tracking defaults.
#
# Normal run:
#   ../.venv/bin/python main.py
#
# This file is the main tuning surface. Command-line flags still override these
# values when you need a temporary experiment:
#   ../.venv/bin/python main.py --cable-segments 3

[camera]
# Leave both input fields empty for the local ZED camera.
input_svo_file = ""
ip_address = ""
resolution = "HD720"
fps = 60
depth_mode = "NEURAL"

[depth]
# Working depth range in meters. Keep this tight around the cable workspace.
min_m = 0.01
max_m = 1.0

# Larger values are stricter for ZED depth confidence. If cable depth disappears,
# lower confidence first, then texture_confidence.
confidence = 95
texture_confidence = 100
fill = true

[viewer]
# Left panel is RGB/segmentation, right panel is the 3D point cloud.
rgb_width = 620
cloud_width = 1180
height = 900
point_size = 2.0

# Options: "segmentation", "tracking", "mask".
rgb_view = "segmentation"

# Display-only persistence. This prevents the 3D cable overlay/support points
# from blinking when measurement frames are skipped for speed or briefly invalid.
hold_frames = 8

[pidnet]
# Relative paths are resolved from this config file.
checkpoint = "models/pidnet_cable_best.pt"
device = "cuda"
threshold = 0.25
base_channels = 24

[endpoint]
# Endpoint anchor source:
#   "neural" -> use the PIDNet endpoint/tape output channel
#   "normal" -> use inferred cable endpoints only
#   "none"   -> disable endpoint anchors
mode = "neural"

[endpoint_markers]
enabled = true
min_area_px = 50
min_points = 8
open_kernel = 3
close_kernel = 5
max_points_per_marker = 256
tape_length_m = 0.035
offset_to_tips = false

[detector]
# Options: "pidnet" for trained neural segmentation, "hsv" for HSV range or
# Gaussian color segmentation. Switch this to compare detector speed and quality.
backend = "pidnet"

# The current checkpoint was trained at full ZED HD720. Full-scale inference
# keeps the live mask close to the labeled data; reduce this only for speed.
scale = 1.0

# Use the previous 2D cable path to crop the next detector pass. A full-frame
# pass runs every full_frame_every frames so the cable can be reacquired.
roi = true
roi_padding_px = 96
full_frame_every = 12

# Run RGB segmentation + 3D measurement every N frames. Skipped frames use the
# particle filter prediction and do not count as lost tracking. 2 gives a 30 Hz
# measurement path on a 60 FPS camera and keeps the UI smoother.
update_every = 2

# Binary mask cleanup after the selected detector. Increase min_area_px to ignore
# small noise; increase close_kernel to bridge tiny mask gaps.
min_area_px = 80
open_kernel = 7
close_kernel = 1

# Used by HSV/legacy centerline geometry frames. The default PIDNet path scores
# masked ZED cable points directly and does not require skeleton extraction.
skeleton_prune_px = 10
skeleton_prune_passes = 2
centerline_smooth_window = 9

[hsv]
# Pure HSV baseline detector. Modes: "range" or "gaussian". OpenCV uses H in
# [0, 179], not degrees, and S/V in [0, 255]. If h_min > h_max, the hue range
# wraps around zero for red cables.
mode = "gaussian"
h_min = 42
h_max = 56
s_min = 58
s_max = 137
v_min = 93
v_max = 170

# Fast HSV path: after initialization, skip skeleton/centerline extraction and
# lift sampled mask pixels directly into the particle filter. Geometry is still
# refreshed every geometry_every frames and during reacquisition.
fast_mask_only = true
geometry_every = 12
mask_points = 512

# Gaussian HSV model uses features [sin(H), cos(H), S, V], where S/V are scaled
# to 0..1. Tune these from labeled masks with tools/tune_hsv_from_masks.py.
gaussian_threshold = 0.0
gaussian_positive_mean = [0.984872, -0.122578, 0.387804, 0.521765]
gaussian_positive_std = [0.033578, 0.117712, 0.091709, 0.060365]
gaussian_negative_mean = [-0.081639, 0.422335, 0.022732, 0.583794]
gaussian_negative_std = [0.71042, 0.557233, 0.042556, 0.089174]

[point_cloud]
# Visual point-cloud sampling. Larger stride and lower max_points make the
# display faster without changing particle-filter scoring.
stride = 4
max_points = 100000
cloud_update_every = 2

# Retrieve the ZED confidence map every N frames. Use 0 to disable confidence
# filtering, or increase to 2-3 if confidence retrieval becomes expensive.
confidence_update_every = 2

[cable]
# Number of connected fixed-length line segments. 2 segments gives 3 vertices.
segments = 12

# Physical cable length in meters. Measured real cable is 56 cm.
length_m = 0.56
length_scale = 1.0

# Fixed segment length in meters. 0 estimates the length once from the first
# valid 3D measurement and then keeps it fixed.
segment_length_m = 0.0

# Maximum raw support points drawn in the 3D viewer.
max_visual_points = 8000

[measurement]
# Used by HSV/legacy centerline lifting.
node_search_px = 2

# Maximum ordered 2D centerline pixels lifted into 3D before fitting on the
# HSV/legacy centerline path.
centerline_points = 48

# Reject a local ZED lookup window when local depth is too spread out. This
# removes edge/background depth. Use 0 to disable.
local_depth_spread_m = 0.06

# Smooth fitted 3D measurement nodes before proposal injection. The PIDNet path
# now builds an ordered 3D centerline from the orange cloud, so this stays off
# and the particle filter handles temporal smoothing.
smoothing = false
smoothing_alpha = 0.30
smoothing_gate_m = 0.040

# For PIDNet masks, first collapse the orange 3D support cloud into an ordered
# measured centerline. The PF then tracks this measured shape instead of
# discovering the shape from unordered points alone.
mask_centerline = true
mask_centerline_reference_gate_m = 0.15
mask_centerline_max_residual_m = 0.08

# Before fitting, keep lifted 3D points near the previous filtered cable on the
# HSV/centerline paths. The PIDNet mask-point path bypasses this gate so a bad
# particle-filter estimate cannot suppress a good neural mask cloud.
prediction_gate_m = 0.12

# After this many prediction-only frames, prediction gating is disabled so the
# tracker can reacquire from the full RGB segmentation.
gate_reacquire_after = 4

# ZED confidence max for accepted cable depth samples. Use a negative value to
# disable confidence filtering.
confidence_max = 85.0

[particle_filter]
enabled = true
particles = 500

# Initial spread when the first valid cable measurement initializes particles.
initial_node_std_m = 0.025
initial_direction_std = 0.10

# Per-frame process noise on cable vertices, in meters.
process_node_std_m = 0.006
process_direction_std = 0.020

# Direction smoothing is off because the ordered orange-cloud centerline is now
# the main shape measurement. Re-enable only if the green chain becomes noisy.
direction_smooth_passes = 0

# Measurement likelihood width, in meters. The ordered measured centerline lets
# the PF trust current cable geometry more directly.
measurement_node_std_m = 0.020

# Maximum masked ZED cable points used to score particles by point-to-segment
# distance. This is the main particle-score cost knob.
measurement_points = 1024

# Particle scoring uses tensor parallelism on CUDA when available.
scoring_backend = "auto"
score_chunk_points = 512

# During PF initialization/reacquisition, order the masked 3D cloud by
# estimating cable endpoints on a k-nearest-neighbor graph. The raw unordered
# cloud is still used for particle scoring.
endpoint_ordering = true
ordering_max_points = 384
ordering_knn = 8

# Periodic endpoint graph refresh can correct drift, but it can also cause
# sudden jumps. Keep it off during stable tracking unless reacquisition is bad.
endpoint_refresh_interval = 0

# After initialization, order new masked points by projection onto the current
# filtered chain. This avoids rebuilding the expensive endpoint graph every
# frame and keeps start/end identity stable.
reference_ordering = true
reference_ordering_gate_m = 0.08

# Keep the particle start/end close to the current measured endpoints. This is
# the main guard against segment-order flips in a good unordered point cloud.
endpoint_penalty_weight = 1.0

# Reset the PF from the current valid masked-cloud fit when the mean node
# disagreement is this large. Use 0 to disable.
measurement_reset_error_m = 0.25

# Adaptive measurement proposals reduce detector jitter: when the measured cable
# is already close to the filtered estimate, only stable_ratio particles are
# regenerated. Because the PIDNet mask cloud is the trusted measurement, the
# maximum ratio is intentionally high enough to recover from bad particles.
measurement_proposal_ratio = 0.45
measurement_proposal_stable_ratio = 0.12
measurement_proposal_start_error_m = 0.015
measurement_proposal_full_error_m = 0.060
measurement_proposal_node_std_m = 0.012
measurement_proposal_direction_std = 0.025

# Robust scoring keeps this fraction of the lowest point-to-segment distances,
# so a few bad depth points do not dominate the weight.
score_keep_fraction = 0.90

# Penalize particles whose visible segments do not own enough support points.
# Use 0 to disable.
coverage_penalty_m = 0.025
coverage_min_fraction = 0.05

# Bend penalty is off so tight measured cable bends can be followed. The measured
# centerline and raw support cloud now provide the shape constraint.
bend_penalty_m = 0.0

# Display estimate is always the weighted average of the best particles.
top_particles = 50

# Keep a fixed exploration budget as globally random chain hypotheses within the
# current measured support-cloud bounds.
global_random_particle_ratio = 0.10
global_random_bounds_padding_m = 0.10

# Known endpoints define a constrained fixed-length chain. Internally each
# particle is projected so node 0 and node N match the detected/drone endpoints
# while every segment keeps the fixed cable length.
endpoint_constraint_iterations = 16
endpoint_constraint_tolerance_m = 0.0001

# Legacy compatibility knob; current estimate uses top_particles above.
map_estimate_effective_ratio = 0.35

# Minimum support required before a measurement update is trusted.
min_measurement_points = 12
min_segment_points = 4

# Max distance for assigning support points to visible/occluded segments.
occlusion_gate_m = 0.12

# Distance assigned to invalid/outlier support points during scoring.
outlier_distance_m = 0.08

# Resample when effective sample size drops below this fraction of particles.
resample_effective_ratio = 0.50

# After this many frames without trusted measurements, reset on the next valid
# measurement. Motion noise ramps up until max_motion_noise_scale.
max_prediction_frames = 12
max_motion_noise_scale = 4.0
