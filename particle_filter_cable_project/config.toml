# Cable particle filter live-tracking defaults.
#
# Normal run:
#   ../.venv/bin/python main.py
#
# This file is the main tuning surface. Command-line flags still override these
# values when you need a temporary experiment:
#   ../.venv/bin/python main.py --cable-segments 3

[camera]
# Leave both input fields empty for the local ZED camera.
input_svo_file = ""
ip_address = ""
resolution = "HD720"
fps = 60

# Pin the ZED SDK and PyTorch to the RTX 4080. Use -1 to let the SDK choose.
sdk_gpu_id = 0

# These keep camera recovery/retrieval from blocking the render loop when the
# SDK can handle the work asynchronously.
async_image_retrieval = true
async_grab_camera_recovery = true

# NEURAL is the live balance point. NEURAL_PLUS is more accurate but heavier.
depth_mode = "NEURAL"

# SDK color/gamma enhancement helps the RGB segmenter in uneven lighting.
image_enhancement = true

[depth]
# Working depth range in meters. Keep this tight around the cable workspace.
min_m = 0.01
max_m = 1.0

# 0 disables depth stabilization. The SDK docs note stabilization can enable
# positional tracking in the background, which costs performance. Raise this if
# the camera is fixed and depth jitter is worse than frame rate.
stabilization = 0

# Larger values are stricter for ZED depth confidence. If cable depth disappears,
# lower confidence first, then texture_confidence.
confidence = 95
texture_confidence = 100
fill = true

[viewer]
# Left panel is RGB/segmentation, right panel is the 3D point cloud.
rgb_width = 620
cloud_width = 1180
height = 900
point_size = 2.0

# Options: "segmentation", "tracking", "mask".
rgb_view = "segmentation"

# Display-only persistence. This prevents the 3D cable overlay/support points
# from blinking when measurement frames are skipped for speed or briefly invalid.
hold_frames = 8

# Draw/upload the RGB and cable overlay every N camera frames. Detection and PF
# still run on their own cadence in the measurement worker.
update_every = 2

[pidnet]
# Relative paths are resolved from this config file.
checkpoint = "models/pidnet_cable_best.pt"
device = "cuda"
threshold = 0.25
base_channels = 24

# CUDA autocast + channels-last inference for faster PIDNet masks.
amp = true

[detector]
# Live tracking uses the trained PIDNet binary cable segmenter.

# The current checkpoint was trained at full ZED HD720. Full-scale inference
# keeps the live mask close to the labeled data; reduce this only for speed.
scale = 1.0

# Run RGB segmentation + 3D measurement every N frames. Fast cable motion needs
# fresh measurements every frame; raise this only after tracking is stable.
update_every = 1

# Binary mask cleanup after the selected detector. Increase min_area_px to ignore
# small noise; increase close_kernel to bridge tiny mask gaps.
min_area_px = 50
open_kernel = 1
close_kernel = 5

# Kept at defaults; the active PIDNet support-cloud path does not require
# skeleton extraction.
skeleton_prune_px = 10
skeleton_prune_passes = 2
centerline_smooth_window = 9

[point_cloud]
# Visual point-cloud sampling. Larger stride and lower max_points make the
# display faster without changing particle-filter scoring.
stride = 5
max_points = 40000
cloud_update_every = 2

# Retrieve the ZED confidence map every N frames. Use 0 to disable confidence
# filtering, or increase to 2-3 if confidence retrieval becomes expensive.
confidence_update_every = 2

[processing]
# Overlap RGB detection, 3D measurement fitting, and particle-filter scoring
# with the camera/UI loop. If the worker falls behind, the newest display frame
# is kept and that measurement request is skipped instead of blocking render.
async_measurement = true

[cable]
# Number of connected fixed-length line segments. 2 segments gives 3 vertices.
segments = 12

# Physical cable length in meters. Set this for drone experiments so occluded
# parts remain constrained by the known cable length. 0 estimates segment length
# once from the first valid 3D measurement.
length_m = 0.56

# Use a slightly shorter effective tracking length so noisy endpoints do not
# force the fixed-length segment chain to spend excess length as zigzag.
length_scale = 0.96

# Per-segment length override in meters. Used only when length_m is 0.
segment_length_m = 0.0

# Maximum raw support points drawn in the 3D viewer.
max_visual_points = 2000

[measurement]
# ZED confidence max for accepted cable depth samples. Use a negative value to
# disable confidence filtering.
confidence_max = 85.0

[particle_filter]
particles = 800

# Initial spread when the first valid cable measurement initializes particles.
initial_node_std_m = 0.025
initial_direction_std = 0.10

# Per-frame process noise on cable vertices, in meters.
process_node_std_m = 0.002
process_direction_std = 0.006

# Per-node velocity prediction carries covered cable portions through short
# occlusions. Velocities are learned only from visible nodes and decay when a
# node is hidden or the filter is prediction-only.
velocity_prediction = true
velocity_alpha = 0.15
velocity_decay = 0.60
velocity_deadband_mps = 0.06
max_velocity_mps = 0.20

# Direction smoothing is off for the simple point-to-cable baseline.
direction_smooth_passes = 0

# Measurement likelihood width, in meters, for the mean point-to-cable-distance
# objective.
measurement_node_std_m = 0.020

# Maximum masked ZED cable points used to score particles by point-to-segment
# distance. This is the main particle-score cost knob.
measurement_points = 768

# Particle scoring uses tensor parallelism on CUDA when available.
scoring_backend = "auto"
score_chunk_points = 512

# During PF initialization/reacquisition, order the masked 3D cloud by
# estimating cable endpoints on a k-nearest-neighbor graph. The raw unordered
# cloud is still used for particle scoring.
endpoint_ordering = true
ordering_max_points = 256
ordering_knn = 8

# After initialization, order new masked points by projection onto the current
# filtered chain. This avoids rebuilding the expensive endpoint graph every
# frame and keeps start/end identity stable.
reference_ordering = true
reference_ordering_gate_m = 0.08

# Adaptive measurement proposals reduce detector jitter: when the measured cable
# is already close to the filtered estimate, only stable_ratio particles are
# regenerated. Because the PIDNet mask cloud is the trusted measurement, the
# maximum ratio is intentionally high enough to recover from bad particles.
measurement_proposal_ratio = 0.35
measurement_proposal_stable_ratio = 0.04
measurement_proposal_start_error_m = 0.015
measurement_proposal_full_error_m = 0.060
measurement_proposal_node_std_m = 0.006
measurement_proposal_direction_std = 0.012

# Proposal mixture: most injected particles stay near the temporary
# measurement fit, some are broad measurement proposals for recovery, and some
# stay near the current displayed chain so one noisy fit does not take over.
measurement_proposal_wide_fraction = 0.10
measurement_proposal_current_fraction = 0.40
measurement_proposal_wide_std_multiplier = 3.0

# Main middle-shape scoring objective:
#   E(x) = mean_j min_i distance(point_j, cable_segment_i(x))^2
# Endpoint anchors are disabled by default because endpoints inferred only from
# the masked cable cloud are easy to mis-detect. Re-enable when endpoints come
# from a reliable source such as drone attachment poses.
endpoint_anchor_weight = 0.0
endpoint_anchor_projection = false
endpoint_anchor_projection_gain = 0.0
endpoint_anchor_projection_passes = 1

# Output is a weighted average of top particles near the MAP particle after
# simple point-to-cable scoring. Options: "top_clustered", "top_weighted",
# "map", "weighted", or "auto".
estimate_mode = "top_clustered"
top_particles = 10
top_particle_cluster_gate_m = 0.030

# In auto mode only, display the best actual particle when weights collapse
# instead of a direction average that may not correspond to any valid hypothesis.
map_estimate_effective_ratio = 0.35

# Minimum support required before a measurement update is trusted.
min_measurement_points = 12
min_segment_points = 4

# Max distance for assigning support points to visible/occluded segments.
occlusion_gate_m = 0.12

# When points are assigned to visible segments, score each point only against
# its assigned segment neighborhood instead of every segment. This makes covered
# segments receive no negative evidence and is cheaper on CPU/CUDA.
occlusion_segment_scoring = true
occlusion_segment_window = 1

# Distance assigned to invalid/outlier support points during scoring.
outlier_distance_m = 0.08

# Resample when effective sample size drops below this fraction of particles.
resample_effective_ratio = 0.50

# After this many frames without trusted measurements, reset on the next valid
# measurement. Motion noise ramps up until max_motion_noise_scale.
max_prediction_frames = 12
max_motion_noise_scale = 4.0
